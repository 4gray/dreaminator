name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and generated assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Scan source for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --redact .
      - run: make test
      - run: make plugin-unit
      - name: Check generated artwork
        run: |
          make icons ui-assets
          git diff --exit-code -- web/static/icon.svg web/static/icon-192.png web/static/icon-512.png plugin/Dreaminator/plugin.png plugin/Dreaminator/ui

  simulator:
    name: MIPS simulator and Python 2.7/3 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: make sim
      - name: Wait for the emulated service
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/api/state > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs dreaminator-sim
          exit 1
      - run: make plugin-test
      - name: Simulator logs
        if: failure()
        run: docker logs dreaminator-sim
      - name: Stop simulator
        if: always()
        run: make sim-stop

  packages:
    name: DM520 and Vu+ release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: make ipk ipk-vuuno4kse
      - name: Validate packaged binaries and artwork
        run: python3 tools/check_packages.py
      - name: Smoke-test both CPUs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          qemu-mipsel -cpu 4Kc dist/dreaminator -version
          qemu-arm -cpu cortex-a15 dist/vuuno4kse/dreaminator -version
      - name: Stage release assets
        run: |
          mkdir -p dist/release
          cp dist/*.ipk docs/Dreaminator-install-Windows.pdf dist/release/
          cd dist/release
          sha256sum ./*.ipk ./*.pdf > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
