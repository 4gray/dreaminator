name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match tag, source version and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^VERSION ?= //p' Makefile)
          test "$TAG" = "v$version"
          test -s "docs/releases/$TAG.md"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified packages
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Verify checksums
        run: cd dist/release && sha256sum -c SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            test "$draft" = true  # Never replace an already published release.
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --draft=false --latest \
              --title "Dreaminator ${TAG#v}" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" dist/release/* \
              --verify-tag --latest --title "Dreaminator ${TAG#v}" \
              --notes-file "docs/releases/$TAG.md"
          fi
