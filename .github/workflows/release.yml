name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<VERSION> from Makefile)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        name: Match tag, source version and release notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^VERSION ?= //p' Makefile)
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="${INPUT_TAG:-v$version}"
          fi
          test "$tag" = "v$version"
          test -s "docs/releases/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified packages
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Verify checksums
        run: cd dist/release && sha256sum -c SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = true  # Never replace an already published release.
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --draft=false --latest \
              --title "Dreaminator ${TAG#v}" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" dist/release/* \
              --target "$TARGET_SHA" --latest --title "Dreaminator ${TAG#v}" \
              --notes-file "docs/releases/$TAG.md"
          fi
